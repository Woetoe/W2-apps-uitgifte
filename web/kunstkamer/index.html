<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kunstkamer</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#14161f">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="W2 Apps">

<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../w2game.css">
<style>
/* Museum bij nacht: donker omber, goud als accent, Delfts blauw ernaast. */
:root{
  --bg:#130f0b; --bg2:#1d1712; --panel:#271f18; --line:#3b2e22;
  --text:#f6eedf; --muted:#b8a88f; --accent:#e2b84a; --accent-ink:#2a1d05; --blue:#4c7cc4; --red:#e5533d; --good:#6fbf73; --warn:#ff8a6b;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif;
  color-scheme:dark;
}
body{background:radial-gradient(120% 70% at 50% 0%,#2a1f15,var(--bg) 62%);background-attachment:fixed;color:var(--text);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#view{height:100%}
.wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h2{font-size:22px;flex:1;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;flex:none;padding:0}
.btn{border:0;border-radius:14px;padding:14px 16px;min-height:52px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn.quiet{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px}
.note{color:var(--muted);font-size:14px;margin:0}
/* hero */
.hero{position:relative;border-radius:20px;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(19,15,11,.15),rgba(19,15,11,.92) 78%),url(werken/nachtwacht.jpg) center 30%/cover}
.hero .kick{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:46px;line-height:.95;letter-spacing:-.03em}
.hero p{color:#e8dcc6;margin-top:6px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(29,23,18,.85);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:700}
.chip small{font-weight:500;color:var(--muted)}
/* gereedschap */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{font-size:20px}
.sec-h small{color:var(--muted);font-size:13px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-align:center;line-height:1.15;min-height:92px}
.tool svg{width:30px;height:30px}
.tool b{font:800 18px/1 var(--f-display);color:var(--text)}
.tool.locked{opacity:.45}
.tool[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg2));color:var(--text)}
.tool:disabled{opacity:.35}
/* dagelijkse kraak */
.daily{display:flex;gap:14px;align-items:center;text-align:left;background:linear-gradient(135deg,#22324d,#1a2335);border:1px solid #33496d;border-radius:18px;padding:14px 16px;min-height:84px;width:100%}
.daily .ic{width:48px;height:48px;border-radius:14px;background:#2c4166;display:grid;place-items:center;flex:none}
.daily b{display:block;font-size:17px}
.daily span span{color:#b9c8e2;font-size:14px}
.daily.done{background:var(--bg2);border-color:var(--line)}
.daily.done .ic{background:var(--panel)}
.daily:disabled{opacity:.6}
.pending{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--bg2));border:1px solid var(--accent);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.pending b{display:block}
/* wereld en levels */
.world{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.world-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.world-h h2{font-size:22px}
.world-h p{color:var(--muted);font-size:14px;margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:3/4;border-radius:10px;border:2px solid #5a4528;background:#1a140f center/cover no-repeat;position:relative;padding:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;overflow:hidden;box-shadow:inset 0 0 0 2px #2a1f14}
.lv::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.05) 40%,rgba(0,0,0,.75))}
.lv>*{position:relative}
.lv .num{font:800 17px/1 var(--f-display);margin-top:6px;text-shadow:0 1px 3px #000}
.lv .st{font-size:11px;letter-spacing:1px;margin-bottom:5px;color:#5c4a30}
.lv .st i{font-style:normal;color:var(--accent)}
.lv.done{border-color:var(--accent)}
.lv.next{border-color:var(--accent);animation:glow 1.6s ease-in-out infinite}
.lv.locked{opacity:.45}
.lv.locked .num{margin-top:auto;margin-bottom:auto}
.lv.final{grid-column:span 1}
.lv.final .num::after{content:"★";color:var(--accent);margin-left:2px;font-size:12px;vertical-align:top}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px #2a1f14,0 0 14px rgba(226,184,74,.55)}}
.soon{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.soon div{border:1px dashed var(--line);border-radius:14px;padding:12px 8px;text-align:center;color:var(--muted);font-size:13px;line-height:1.25}
.soon b{display:block;color:var(--text);font-size:14px;margin-bottom:2px}
.wide{width:100%}
/* museum */
.hall{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;border-radius:18px;background:linear-gradient(180deg,#3a1f1c,#2a1614);border:1px solid #4a2a26}
.hall.rare{background:linear-gradient(180deg,#1d2a40,#141d2e);border-color:#2c3d5c}
.frame{border:0;padding:7px;background:linear-gradient(135deg,#f0cf6f,#a67c25 45%,#e9c35c 70%,#8a6418);border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.5);display:flex;flex-direction:column}
.frame .in{background:#0d0a07;aspect-ratio:4/5;overflow:hidden;display:grid;place-items:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame.empty{background:linear-gradient(135deg,#4a3b26,#2b2116);opacity:.7}
.frame.empty .in{color:var(--muted);font:800 26px/1 var(--f-display)}
.cell{display:flex;flex-direction:column}
.plate{font-size:12px;color:#e9dfcc;text-align:center;margin-top:6px;line-height:1.2}
.plate small{display:block;color:var(--muted)}
/* spelen */
.play{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));gap:8px}
.hud{display:flex;align-items:center;gap:10px;flex:none}
.hud .ttl{flex:1;min-width:0}
.hud .ttl b{display:block;font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .ttl small{color:var(--muted);font-size:13px}
.alarm{display:flex;gap:5px;flex:none}
.alarm i{width:14px;height:14px;border-radius:50%;background:#3a2c22;border:1px solid #5a4636}
.alarm i.on{background:var(--red);border-color:#ff8f7c;box-shadow:0 0 10px var(--red)}
.hud2{display:flex;gap:8px;flex:none;justify-content:center;flex-wrap:wrap}
.pill{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill b{color:var(--text)}
.pill.over b{color:var(--warn)}
.stage{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;background:#0b0806;border:1px solid var(--line);touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.say{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(19,15,11,.9);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;white-space:nowrap;pointer-events:none;transition:opacity .2s}
.say.hot{border-color:var(--red);color:#ffd2ca}
.say.gold{border-color:var(--accent);color:#fff2c9}
.say[hidden]{display:block!important;opacity:0}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.banner>div{background:rgba(19,15,11,.92);border:2px solid var(--accent);border-radius:18px;padding:14px 22px;text-align:center;animation:pop .25s ease-out}
.banner h2{font-size:28px}
.banner p{color:var(--muted);margin:2px 0 0}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.ctl{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px}
.pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,54px);gap:6px}
.pad button{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg2));border-radius:14px;display:grid;place-items:center;padding:0;color:var(--text);touch-action:manipulation;box-shadow:0 3px 0 #0a0705}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0705;border-color:var(--accent)}
.pad button svg{width:26px;height:26px}
.pad .w{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:1px;align-items:center}
.pad .w svg{width:20px;height:20px}
.side{display:flex;flex-direction:column;gap:8px}
.big{min-width:200px;min-height:72px;border-radius:20px;border:0;font:800 22px/1 var(--f-display);color:var(--accent-ink);background:radial-gradient(circle at 40% 30%,#f5d77f,var(--accent) 60%,#b48a2a);box-shadow:0 6px 0 #6e5216;touch-action:none}
.big.on,.big:active{transform:translateY(4px);box-shadow:0 2px 0 #6e5216}
.tb{display:flex;gap:8px;justify-content:center;flex:none;min-height:0}
.tb button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:6px 12px;min-height:44px;font-weight:700;font-size:14px}
.tb button svg{width:22px;height:22px}
.tb button:disabled{opacity:.35}
.tb .passive{border-style:dashed;color:var(--muted);font-weight:600}
/* vellen */
#layer:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(8,6,4,.78);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font-size:24px}
.target{display:flex;gap:14px;align-items:center}
.target .pic{width:92px;flex:none;padding:5px;background:linear-gradient(135deg,#f0cf6f,#a67c25 45%,#e9c35c 70%,#8a6418);border-radius:3px}
.target .pic div{aspect-ratio:4/5;background:#000 center/cover;filter:brightness(.55) saturate(.6)}
.target .pic.got div{filter:none}
.target b{display:block;font-size:18px;font-family:var(--f-display)}
.target small{color:var(--muted)}
.goals{display:flex;flex-direction:column;gap:6px}
.goal{display:flex;gap:10px;align-items:center;font-size:15px}
.goal .s{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:#5c4a30;font-size:15px;flex:none}
.goal .s.on{background:color-mix(in srgb,var(--accent) 22%,var(--panel));color:var(--accent)}
.goal .new{font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 6px;margin-left:4px}
.modeic{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:14px}
.modeic svg{width:30px;height:30px;flex:none}
.modeic b{color:var(--text);display:block;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row .d{color:var(--muted);font-size:14px}
.toggle{position:relative;width:52px;height:30px;border-radius:15px;border:0;background:var(--line);flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:transform .15s}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result h2{font-size:36px;line-height:1}
.result .big-pic{width:min(70%,260px);padding:9px;background:linear-gradient(135deg,#f0cf6f,#a67c25 45%,#e9c35c 70%,#8a6418);border-radius:4px;box-shadow:0 10px 30px rgba(226,184,74,.25);animation:reveal .6s ease-out}
.result .big-pic img{width:100%;display:block}
@keyframes reveal{from{transform:scale(.8) rotate(-3deg);opacity:0}}
.stars3{display:flex;gap:6px;justify-content:center;font-size:38px;line-height:1}
.stars3 span{color:#3b2e22}
.stars3 span.on{color:var(--accent);animation:pop .3s ease-out backwards}
.stars3 span.on:nth-child(2){animation-delay:.15s}.stars3 span.on:nth-child(3){animation-delay:.3s}
.reward{width:100%;background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left}
.reward b{display:block}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lost{color:var(--warn);font-weight:600}
.btns{display:flex;flex-direction:column;gap:8px;width:100%}
.btns .two{display:flex;gap:8px}
.btns .two .btn{flex:1}
.viewer img{width:100%;border-radius:4px;display:block}
.viewer .vf{padding:10px;background:linear-gradient(135deg,#f0cf6f,#a67c25 45%,#e9c35c 70%,#8a6418);border-radius:4px}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:15px}
.rules b{color:var(--text)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="view"></div>
<div id="layer"></div>
<script src="../web.js"></script>

<script>
(function () {
'use strict';
const K = window.KUNSTKAMER, A = window.KUNSTKAMER_ART;
const $view = document.getElementById('view'), $layer = document.getElementById('layer');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const IC = {
  back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  gear: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>',
  menu: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  close: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l8 11H4z"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 19L4 8h16z"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 12l11-8v16z"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 12L8 20V4z"/></svg>',
  wait: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/></svg>',
  museum: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 9l9-5 9 5zM5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#e2b84a" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M9.5 14.5l2 2 3.5-4" stroke="#9fd0ff"/></svg>',
  star: '★'
};
// gereedschap-iconen
const TI = {
  sleutel: '<svg viewBox="0 0 32 32"><circle cx="10" cy="16" r="6" fill="none" stroke="#e2b84a" stroke-width="3"/><path d="M16 16h12M24 16v5M28 16v4" stroke="#e2b84a" stroke-width="3" stroke-linecap="round"/></svg>',
  fluit: '<svg viewBox="0 0 32 32"><path d="M4 13h16a6 6 0 1 1 0 8H4z" fill="#c9ced4"/><circle cx="20" cy="17" r="3" fill="#6b737c"/><path d="M8 13v-3h6v3" fill="none" stroke="#c9ced4" stroke-width="2"/><path d="M27 8l3-3M28 13h3M27 18l3 2" stroke="#e2b84a" stroke-width="2" stroke-linecap="round"/></svg>',
  zand: '<svg viewBox="0 0 32 32"><path d="M8 4h16M8 28h16" stroke="#b8913d" stroke-width="3" stroke-linecap="round"/><path d="M10 5c0 7 12 7 12 11s-12 4-12 11h12c0-7-12-7-12-11S22 12 22 5z" fill="none" stroke="#e8dcc6" stroke-width="2"/><path d="M12 25c2-3 6-3 8 0z" fill="#e2b84a"/><path d="M13 9h6l-3 4z" fill="#e2b84a"/></svg>',
  kaart: '<svg viewBox="0 0 32 32"><path d="M4 7l8-3 8 3 8-3v21l-8 3-8-3-8 3z" fill="#e8dcc6"/><path d="M12 4v21M20 7v21" stroke="#b8a88f" stroke-width="1.5"/><path d="M7 20l4-4 4 3 5-6 4 2" fill="none" stroke="#e5533d" stroke-width="2" stroke-dasharray="2 2"/></svg>'
};

const PKEY = 'kunstkamer', SKEY = 'kunstkamer-settings';
const load = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
let P = K.fixProgress(load(PKEY));
if (typeof P.pending !== 'number') P.pending = 0;
const save = () => { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) {} };
const S = Object.assign({ sound: true, vibrate: true, numbers: false }, load(SKEY) || {});
const saveS = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---------------- afbeeldingen */
const IMG = {};
function img(id) {
  if (!IMG[id]) { const im = new Image(); im.decoding = 'async'; im.src = 'werken/' + id + '.jpg'; im.onload = () => { if (run) draw(); }; IMG[id] = im; }
  return IMG[id];
}

/* ---------------- geluid en trillen */
let AC = null;
function ac() { if (!S.sound) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } return AC; }
function tone(f, d, type, vol, when) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
const SFX = {
  step: () => tone(180, 0.05, 'triangle', 0.05),
  push: () => tone(90, 0.12, 'square', 0.08),
  pick: () => { tone(880, 0.12, 'sine', 0.12); tone(1320, 0.18, 'sine', 0.1, 0.08); },
  key: () => { tone(1200, 0.08, 'triangle', 0.08); tone(1600, 0.1, 'triangle', 0.07, 0.06); },
  door: () => { tone(140, 0.2, 'sawtooth', 0.05); tone(110, 0.25, 'sawtooth', 0.04, 0.1); },
  click: () => tone(2400, 0.03, 'square', 0.06),
  hit: () => { tone(1800, 0.04, 'square', 0.08); tone(900, 0.08, 'triangle', 0.08, 0.03); },
  alarm: () => { tone(620, 0.16, 'sawtooth', 0.12); tone(460, 0.2, 'sawtooth', 0.12, 0.17); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, i * 0.1)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.07, i * 0.14)),
  tool: () => { tone(660, 0.1, 'sine', 0.1); tone(990, 0.12, 'sine', 0.08, 0.07); },
  slide: () => tone(300, 0.05, 'triangle', 0.05)
};
const sfx = k => { try { SFX[k] && SFX[k](); } catch (e) {} };
const buzz = p => { if (S.vibrate) try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

    const m = K.starMask(P, l.n), done = K.isDone(P, l.n), open = K.unlocked(P, l.n);

/* ---------------- vellen */
function renderSheet() {
  if (!sheet) { $layer.innerHTML = ''; return; }
  let h = '';
  if (sheet.type === 'intro') h = introHtml();
  else if (sheet.type === 'result') h = resultHtml();
  else if (sheet.type === 'menu') h = menuHtml();
  else if (sheet.type === 'settings') h = settingsHtml();
  else if (sheet.type === 'work') h = workHtml();
  else if (sheet.type === 'toolinfo') h = toolInfoHtml();
  else if (sheet.type === 'welcome') h = welcomeHtml();
  else if (sheet.type === 'pick') h = pickHtml();
  $layer.innerHTML = `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
}
function closeSheet() { sheet = null; renderSheet(); }

function goalsHtml(l, mask, gotMask) {
  const rows = [{ text: 'Werk gestolen' }].concat(l.stars.map(st => ({ text: K.starText(st) })));
  return `<div class="goals">${rows.map((r, i) => {
    const on = mask >> i & 1, isNew = gotMask !== undefined && (gotMask >> i & 1) && !((sheet.before | 0) >> i & 1);
    return `<div class="goal"><span class="s ${on ? 'on' : ''}">★</span><span>${esc(r.text)}${isNew ? '<span class="new">NIEUW</span>' : ''}</span></div>`;
  }).join('')}</div>`;
}

function introHtml() {
  const l = K.levelDef(sheet.n), w = K.WORKS[l.work], m = MODE[l.mode], daily = !!sheet.daily;
  const usable = K.toolsFor(l).filter(id => K.toolsUnlocked(P).includes(id));
  const sel = sheet.carry || [];
  const tools = usable.length ? `<div class="sec-h"><h3>Gereedschap mee</h3><small>max. ${K.MAX_CARRY} · alleen wat je gebruikt raakt op</small></div>
    <div class="tools">${usable.map(id => { const t = K.TOOL[id], n = P.tools[id] | 0; return `<button class="tool" data-a="carry" data-id="${id}" aria-pressed="${sel.includes(id)}" ${n ? '' : 'disabled'}>${TI[id]}<b>${n}</b>${esc(t.name)}</button>`; }).join('')}</div>` : '';
  return `<div class="sheet-head"><h2>${daily ? 'Dagelijkse kraak' : 'Level ' + l.n}</h2><button class="iconbtn" data-a="close" aria-label="Sluiten">${IC.close}</button></div>
    <div class="target"><div class="pic ${P.works.includes(l.work) ? 'got' : ''}"><div style="background-image:url(werken/${l.work}.jpg)"></div></div>
      <div><small>${esc(l.titel)}</small><b>${esc(w.t)}</b><small>${esc(w.a)}${w.j ? ' · ' + esc(w.j) : ''}</small></div></div>
    <p>${esc(l.intro)}</p>
    <div class="modeic">${m.ic}<span><b>${m.name}</b>${esc(m.how)}</span></div>
    ${daily ? '<p class="note">Sterren tellen hier niet; de beloning krijg je één keer per dag.</p>' : goalsHtml(l, K.starMask(P, l.n))}
    ${tools}
    <button class="btn" data-a="start">${daily ? 'Kraak beginnen' : 'Beginnen'}</button>`;
}

function resultHtml() {
  const r = sheet, l = K.levelDef(r.n), w = K.WORKS[l.work];
  if (!r.won) {
    return `<div class="result">
      <h2>Gepakt!</h2>
      <p>${r.why ? esc(r.why) + ' ' : ''}De buit van deze poging ben je kwijt${r.used.length ? ', en het gereedschap dat je gebruikte (' + r.used.map(id => K.TOOL[id].name.toLowerCase()).join(', ') + ')' : ''}. Je collectie en je andere gereedschap blijven.</p>
      <div class="btns"><button class="btn" data-a="again">Opnieuw proberen</button><button class="btn quiet" data-a="tohome">Naar de kaart</button></div>
    </div>`;
  }
  const sc = (r.mask & 1) + (r.mask >> 1 & 1) + (r.mask >> 2 & 1);
  let rew = '';
  if (r.daily) {
    rew = r.dailyRes ? `<div class="reward"><b>Beloning van vandaag</b>${r.dailyRes.rare ? `<span>💎 Zeldzaam werk: <b style="display:inline">${esc(K.WORKS[r.dailyRes.rare].t)}</b> hangt nu in je schatkamer.</span>` : ''}<span>Gereedschap: ${r.dailyRes.tools.map(id => K.TOOL[id].name).join(' + ')}.</span>${r.dailyRes.streak > 1 ? `<span>🔥 ${r.dailyRes.streak} dagen op rij!</span>` : ''}</div>`
      : '<div class="reward"><span>Vandaag had je de beloning al. Morgen een nieuwe kraak!</span></div>';
  } else {
    const parts = [];
    if (r.firstWork) parts.push(`<span>🖼 <b style="display:inline">${esc(w.t)}</b> hangt nu in je museum.</span>`);
    if (r.bonus) parts.push(`<span>🎁 Zonder gereedschap gehaald: <b style="display:inline">${esc(K.TOOL[r.bonus].name)}</b> erbij.</span>`);
    if (P.pending > 0) parts.push(`<b>Kies je beloning (${P.pending} over)</b><div class="picks">${pickButtons()}</div>`);
    else if (r.newStars) parts.push(`<span>${r.newStars === 1 ? 'Nieuwe ster' : r.newStars + ' nieuwe sterren'}: beloning gekozen ✓</span>`);
    else if (!r.firstWork) parts.push('<span class="note">Geen nieuwe sterren: speel nog eens voor een betere score.</span>');
    if (parts.length) rew = `<div class="reward">${parts.join('')}</div>`;
  }
  const next = !r.daily && K.levelDef(r.n + 1);
  return `<div class="result">
    <h2>Gestolen!</h2>
    <div class="big-pic"><img src="werken/${l.work}.jpg" alt="${esc(w.t)}"></div>
    <div><b>${esc(w.t)}</b><br><small class="note">${esc(w.a)}${w.j ? ' · ' + esc(w.j) : ''}</small></div>
    ${r.daily ? '' : `<div class="stars3">${[0, 1, 2].map(i => `<span class="${r.gotMask >> i & 1 ? 'on' : ''}">★</span>`).join('')}</div>${goalsHtml(l, r.mask, r.gotMask)}`}
    ${rew}
    <div class="btns">
      ${next ? `<button class="btn" data-a="next" ${P.pending > 0 ? 'disabled' : ''}>Volgende level</button>` : ''}
      <div class="two"><button class="btn quiet" data-a="again" ${P.pending > 0 ? 'disabled' : ''}>Opnieuw</button><button class="btn quiet" data-a="tohome" ${P.pending > 0 ? 'disabled' : ''}>Kaart</button></div>
      ${!r.daily && sc < 3 ? '<p class="note">Opnieuw spelen kan voor de sterren die je nog mist.</p>' : ''}
    </div>
  </div>`;
}

  run.over = true; stopLoop();
  const l = run.l;
  const res = { moves: run.mode === 'sluip' ? run.s.moves : run.moves, time: run.time, alarms: run.alarms, purse: run.mode === 'sluip' ? run.s.purse : false };
  const got = K.starsFor(l, res);
  sfx('win'); buzz([30, 40, 30, 40, 80]);
  if (run.daily) {
    const dr = K.finishDaily(P, run.day);
    save();
    sheet = { type: 'result', won: true, n: run.n, daily: true, dailyRes: dr, used: run.used.slice(), mask: 0, gotMask: 0 };
  } else {
    const before = K.starMask(P, run.n);
    const r = K.finishLevel(P, run.n, got, run.used);
    P.pending = (P.pending | 0) + r.picks;
    save();
    sheet = { type: 'result', won: true, n: run.n, before, mask: r.mask, gotMask: r.gotMask, newStars: r.newStars, bonus: r.bonus, firstWork: r.firstWork, used: run.used.slice() };
  }
  renderSheet();
}
function fail(why) {
  if (!run || run.over) return;
  run.over = true; stopLoop(); setHold(false);
  sfx('lose');
  sheet = { type: 'result', won: false, n: run.n, why, used: run.used.slice(), daily: run.daily };
  renderSheet();
}
function leaveRun() { run = null; stopLoop(); view = 'home'; sheet = null; render(); }

/* ================================================================ invoer */
let down = null;
function stageDown(e) {
  if (!run || run.over || sheet) return;
  const r = e.currentTarget.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  down = { x, y, t: performance.now() };
  if (run.mode === 'kluis') { e.preventDefault(); kluisTap(); }
  if (run.mode === 'gang') { e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); setHold(true); ac(); }
}
function stageUp(e) {
  if (!run) return;
  if (run.mode === 'gang') { setHold(false); return; }
  if (!down || run.over || sheet) { down = null; return; }
  const r = e.currentTarget.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const dx = x - down.x, dy = y - down.y; down = null;
  if (run.mode === 'schuif') { if (Math.hypot(dx, dy) < 30) schuifTap(x, y); else { const ax = Math.abs(dx) > Math.abs(dy); schuifSwipe(ax ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U')); } return; }
  if (run.mode === 'sluip') {
    if (Math.hypot(dx, dy) >= 24) { gridMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U')); return; }
    // tik op een buurvakje
    const L = gridLayout(), g = run.g, cx = Math.floor((x - L.ox) / L.ts), cy = Math.floor((y - L.oy) / L.ts);
    const px = run.s.pos % g.w, py = (run.s.pos / g.w) | 0;
    if (cx === px && cy === py) gridMove('W');
    else if (Math.abs(cx - px) + Math.abs(cy - py) === 1) gridMove(cx > px ? 'R' : cx < px ? 'L' : cy > py ? 'D' : 'U');
  }
}
// vegen bij de schuifpuzzel: de tegel naast het gat schuift die kant op
function schuifSwipe(d) {
  const o = run.o, n = o.n, bx = o.blank % n, by = (o.blank / n) | 0;
  const from = { R: [bx - 1, by], L: [bx + 1, by], D: [bx, by - 1], U: [bx, by + 1] }[d];
  if (from[0] < 0 || from[1] < 0 || from[0] >= n || from[1] >= n) return;
  const B = boardRect();
  schuifTap(B.ox + from[0] * B.ts + B.ts / 2, B.oy + from[1] * B.ts + B.ts / 2);
}

document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-hold]'); if (!h || !run) return;
  e.preventDefault(); ac();
  if (h.dataset.hold === 'peek') { run.peek = true; h.classList.add('on'); }
  if (h.dataset.hold === 'sneak') setHold(true);
});
const holdOff = e => {
  if (!run) return;
  const pk = document.querySelector('[data-hold="peek"]'); if (pk && run.peek) { run.peek = false; pk.classList.remove('on'); }
  if (run.mode === 'gang' && run.holding && !(e.target.closest && e.target.closest('#stage'))) setHold(false);
};
document.addEventListener('pointerup', holdOff);
document.addEventListener('pointercancel', holdOff);
document.addEventListener('contextmenu', e => { if (view === 'play') e.preventDefault(); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'scrim') { if (e.target !== el) return; if (sheet && (sheet.type === 'result' || sheet.type === 'welcome')) return; if (sheet && sheet.type === 'menu') { closeSheet(); return; } closeSheet(); return; }
  ac();
  switch (a) {
    case 'exit': location.href = '../index.html'; return;
    case 'home': view = 'home'; render(); return;
    case 'museum': view = 'museum'; render(); window.scrollTo(0, 0); return;
    case 'settings': sheet = { type: 'settings' }; renderSheet(); return;
    case 'close': closeSheet(); return;
    case 'level': openLevel(+el.dataset.n, false); return;
    case 'daily': { const dn = K.dailyLevel(P, today()); if (dn) openLevel(dn, true); return; }
    case 'carry': {
      const id = el.dataset.id, c = sheet.carry;
      if (c.includes(id)) c.splice(c.indexOf(id), 1);
      else if (c.length < K.MAX_CARRY && (P.tools[id] | 0) > 0) c.push(id);
      else if (c.length >= K.MAX_CARRY) { c.shift(); c.push(id); }
      renderSheet(); return;
    }
    case 'start': startRun(sheet.n, sheet.daily, sheet.carry || []); return;
    case 'toolinfo': sheet = { type: 'toolinfo', id: el.dataset.id }; renderSheet(); return;
    case 'work': sheet = { type: 'work', id: el.dataset.id }; renderSheet(); return;
    case 'pickpending': sheet = { type: 'pick' }; renderSheet(); return;
    case 'pick': {
      if ((P.pending | 0) <= 0) return;
      K.addTool(P, el.dataset.id, 1); P.pending--; save(); sfx('tool');
      if (sheet && sheet.type === 'pick' && P.pending <= 0) { closeSheet(); render(); return; }
      renderSheet(); if (view === 'home' && sheet && sheet.type === 'pick') { const hv = homeHtml(); $view.innerHTML = hv; }
      return;
    }
    case 'welcomed': P.seen = true; save(); closeSheet(); return;
    case 'tog': S[el.dataset.k] = !S[el.dataset.k]; saveS(); if (el.dataset.k === 'vibrate') buzz(30); if (el.dataset.k === 'sound') sfx('pick'); renderSheet(); return;
    case 'reset':
      if (!sheet.confirm) { sheet.confirm = true; renderSheet(); return; }
      P = K.fixProgress(null); P.pending = 0; P.seen = true; save(); closeSheet(); render(); return;
    case 'pause': if (run && !run.over) { sheet = { type: 'menu' }; renderSheet(); setHold(false); } return;
    case 'restart': { const n = run.n, d = run.daily, c = run.carry.filter(id => (P.tools[id] | 0) > 0); run.over = true; startRun(n, d, c); return; }
    case 'quit': leaveRun(); return;
    case 'again': { const n = sheet.n, d = sheet.daily, c = run ? run.carry.filter(id => (P.tools[id] | 0) > 0) : []; startRun(n, d, c); return; }
    case 'next': { const n = sheet.n + 1; run = null; view = 'home'; sheet = null; render(); if (K.levelDef(n)) openLevel(n, false); return; }
    case 'tohome': leaveRun(); return;
    case 'mv': gridMove(el.dataset.d); return;
    case 'klik': kluisTap(); return;
    case 'use': {
      const id = el.dataset.id; if (!run || run.over) return;
      if (run.mode === 'sluip') useGridTool(id);
      else if (run.mode === 'schuif' && id === 'zand') { if (spend('zand')) { run.o.useZand(); say('Zandloper: 20 s geen lantaarn', false, true); } }
      else if (run.mode === 'kluis') {
        if (id === 'sleutel' && spend('sleutel')) { run.o.useSleutel(); run.fx.hit = 1; if (run.o.status === 'won') { run.wait = true; setTimeout(phaseWon, 450); } }
        if (id === 'zand' && spend('zand')) run.o.useZand();
      } else if (run.mode === 'gang') {
        if (id === 'zand' && spend('zand')) { run.o.useZand(); say('Zandloper: lampen trager', false, true); }
        if (id === 'fluit' && spend('fluit')) { run.o.useFluit(); say('Fluitje: lampen 4 s uit', false, true); }
      }
      updateToolbar(); return;
    }
  }
});

document.addEventListener('keydown', e => {
  if (!run || view !== 'play' || sheet || run.over) return;
  const k = e.key;
  const map = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R' };
  if (run.mode === 'sluip') { if (map[k]) { e.preventDefault(); gridMove(map[k]); } else if (k === ' ' || k === '.') { e.preventDefault(); gridMove('W'); } }
  else if (run.mode === 'schuif' && map[k]) { e.preventDefault(); schuifSwipe(map[k]); }
  else if (run.mode === 'kluis' && (k === ' ' || k === 'Enter')) { e.preventDefault(); if (!e.repeat) kluisTap(); }
  else if (run.mode === 'gang' && (k === ' ' || k === 'ArrowRight')) { e.preventDefault(); setHold(true); }
});
document.addEventListener('keyup', e => { if (run && run.mode === 'gang' && (e.key === ' ' || e.key === 'ArrowRight')) setHold(false); });
document.addEventListener('visibilitychange', () => { if (document.hidden && run && !run.over && view === 'play' && !sheet) { sheet = { type: 'menu' }; renderSheet(); setHold(false); } });

window.__w2back = function () {
  if (sheet) {
    if (sheet.type === 'result') { if (P.pending > 0) return true; leaveRun(); return true; }
    if (sheet.type === 'welcome') return true;
    closeSheet(); return true;
  }
  if (view === 'play' && run && !run.over) { sheet = { type: 'menu' }; renderSheet(); setHold(false); return true; }
  if (view !== 'home') { run = null; view = 'home'; render(); return true; }
  return false;
};
if (!P.seen) sheet = { type: 'welcome' };
render();
// voor de browsertest
window.__kunstkamer = { get run() { return run; }, get P() { return P; }, get view() { return view; }, get sheet() { return sheet; }, gridMove, kluisTap, schuifTap, startRun, win, fail };
})();
</script>
